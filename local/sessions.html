<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Sessions — [X]Bot Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>

<style>
  /* Override hex-card absolute positioning so we can grid-lay them.
     Sizes match dashboard HEX_SIZES.sm (175x202) which is what the
     responsive dep-tree typically renders at. */
  .sessions-grid .hex-card {
    position: relative;
    width: 175px;
    height: 202px;
    opacity: 1;
    transform: none;
  }
  .sessions-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, 175px);
    gap: 1.25rem 0.75rem;
    justify-content: center;
    padding: 2rem var(--container-padding) 4rem;
  }

  /* Toolbar */
  .sessions-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    align-items: center;
    padding: 1.25rem var(--container-padding) 0.5rem;
  }
  .sessions-toolbar .toolbar-label {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    color: var(--color-gray);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-right: 0.4rem;
  }
  .filter-btn {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: rgba(255,255,255,0.04);
    color: var(--color-text-soft);
    border: 1px solid var(--color-border);
    padding: 0.45rem 0.8rem;
    cursor: pointer;
    transition: all var(--duration-fast) var(--ease-smooth);
    clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
  }
  .filter-btn:hover { color: var(--color-warning); border-color: var(--color-warning); }
  .filter-btn.active {
    color: var(--color-bg);
    background: var(--color-warning);
    border-color: var(--color-warning);
    box-shadow: 0 0 16px rgba(255,107,0,0.4);
  }
  .sessions-count {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--color-purple-bright);
    letter-spacing: 0.1em;
  }

  /* Type colors per agent_type */
  .hex-card[data-type="dev"] { --type-color: var(--color-test); }
  .hex-card[data-type="evaluator"] { --type-color: var(--color-purple-bright); }
  .hex-card[data-has-hint="true"] .hex-border { background: var(--color-warning-bright); }
  .hex-card[data-has-hint="true"] .hex-type { background: rgba(255,107,0,0.2); color: var(--color-warning-bright); }

  .hex-num {
    font-family: var(--font-mono);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--type-color);
    margin-bottom: 0.3rem;
    letter-spacing: 0.05em;
  }
  .hex-skill {
    font-family: var(--font-mono);
    font-size: 0.5rem;
    color: var(--color-gray);
    letter-spacing: 0.05em;
    margin-top: 0.2rem;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .hex-meta {
    font-family: var(--font-mono);
    font-size: 0.45rem;
    color: var(--color-text-soft);
    margin-top: 0.25rem;
    letter-spacing: 0.04em;
  }
  .hex-hint-badge {
    position: absolute;
    top: 18%;
    right: 18%;
    font-family: var(--font-mono);
    font-size: 0.5rem;
    color: var(--color-warning-bright);
    background: rgba(0,0,0,0.5);
    border: 1px solid var(--color-warning);
    padding: 0.1rem 0.3rem;
    z-index: 4;
    letter-spacing: 0.08em;
  }

  /* Popup overrides for wide content */
  .sessions-popup .popup-card {
    max-width: min(960px, 95vw);
    width: 95%;
    max-height: 88vh;
  }
  .conv-header {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.75rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--color-border);
    padding-right: 2.5rem;
  }
  .conv-num { font-family: var(--font-mono); font-size: 1.2rem; font-weight: 700; color: var(--color-warning); }
  .conv-type {
    font-family: var(--font-mono); font-size: 0.6rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.15em;
    color: var(--type-color, var(--color-test));
    padding: 0.3rem 0.6rem;
    background: color-mix(in srgb, var(--type-color, var(--color-test)) 15%, transparent);
    border: 1px solid var(--type-color, var(--color-test));
  }
  .conv-skill { font-family: var(--font-mono); font-size: 0.7rem; color: var(--color-text-soft); }
  .conv-cost {
    margin-left: auto;
    font-family: var(--font-mono); font-size: 0.65rem;
    color: var(--color-green);
    padding: 0.25rem 0.6rem;
    background: rgba(57,255,20,0.08);
    border: 1px solid var(--color-green-dim);
    clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
  }
  .conv-body {
    display: flex; flex-direction: column; gap: 0.75rem;
    margin-top: 0.5rem;
  }
  .msg {
    border-left: 3px solid var(--color-border);
    padding: 0.75rem 1rem;
    background: var(--color-bg-secondary);
    font-family: var(--font-display);
    font-size: 0.85rem;
    line-height: 1.55;
    color: var(--color-text-soft);
  }
  .msg.role-agent { border-left-color: var(--type-color, var(--color-test)); }
  .msg.role-user {
    border-left-color: var(--color-warning);
    background: linear-gradient(90deg, rgba(255,107,0,0.08), var(--color-bg-secondary) 30%);
  }
  .msg-role {
    font-family: var(--font-mono);
    font-size: 0.55rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--color-gray);
    margin-bottom: 0.4rem;
    display: block;
  }
  .msg.role-user .msg-role { color: var(--color-warning-bright); }
  .msg-content { color: var(--color-text); }
  .msg-content p { margin: 0.4rem 0; }
  .msg-content pre {
    background: #0c0c14;
    border: 1px solid var(--color-border);
    padding: 0.75rem;
    overflow-x: auto;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    margin: 0.5rem 0;
  }
  .msg-content code {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    background: rgba(255,255,255,0.05);
    padding: 0.05rem 0.3rem;
    color: var(--color-warning-bright);
  }
  .msg-content pre code { background: none; padding: 0; color: inherit; }
  .msg-content h1, .msg-content h2, .msg-content h3 {
    font-family: var(--font-display);
    color: var(--color-warning-bright);
    margin: 0.6rem 0 0.3rem;
  }
  .msg-content h1 { font-size: 1.05rem; }
  .msg-content h2 { font-size: 0.95rem; }
  .msg-content h3 { font-size: 0.85rem; }
  .msg-content ul, .msg-content ol { margin: 0.4rem 0 0.4rem 1.4rem; }
  .msg-content blockquote {
    border-left: 2px solid var(--color-purple-bright);
    padding-left: 0.75rem;
    color: var(--color-text-soft);
    margin: 0.5rem 0;
  }
  .msg-content a { color: var(--color-test); }
  .msg-content table {
    border-collapse: collapse;
    margin: 0.5rem 0;
    font-size: 0.75rem;
  }
  .msg-content th, .msg-content td {
    border: 1px solid var(--color-border);
    padding: 0.3rem 0.5rem;
  }

  .empty-state {
    text-align: center;
    padding: 4rem;
    font-family: var(--font-mono);
    color: var(--color-gray);
  }

  .page-header {
    padding: 2rem var(--container-padding) 0.5rem;
    position: relative;
    z-index: 2;
    margin-top: 8rem; /* clears fixed .site-nav (top:4.5rem) */
  }
  .page-header h1 {
    font-family: var(--font-display);
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--color-text);
    letter-spacing: 0.02em;
  }
  .page-header .graph-name {
    color: var(--color-warning);
    font-family: var(--font-mono);
  }
  .page-header p {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--color-gray);
    margin-top: 0.4rem;
    letter-spacing: 0.05em;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--color-text-soft);
    text-decoration: none;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--color-border);
    padding: 0.5rem 0.9rem;
    margin-bottom: 0.9rem;
    transition: all var(--duration-fast) var(--ease-smooth);
    clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
  }
  .back-btn:hover {
    color: var(--color-warning);
    border-color: var(--color-warning);
    background: rgba(255, 107, 0, 0.08);
    box-shadow: 0 0 12px rgba(255, 107, 0, 0.25);
  }
  .back-btn svg { display: block; }
</style>

<!-- Popup -->

<!-- Rounded hex clip path (matches dashboard) -->
<svg width="0" height="0" style="position:absolute;">
  <defs>
    <clipPath id="hex-clip-rounded" clipPathUnits="objectBoundingBox">
      <path d="M 0.425 0.0375 Q 0.5 0, 0.575 0.0375 L 0.925 0.2125 Q 1 0.25, 1 0.325 L 1 0.675 Q 1 0.75, 0.925 0.7875 L 0.575 0.9625 Q 0.5 1, 0.425 0.9625 L 0.075 0.7875 Q 0 0.75, 0 0.675 L 0 0.325 Q 0 0.25, 0.075 0.2125 Z"/>
    </clipPath>
  </defs>
</svg>

<script>
const params = new URLSearchParams(location.search);
const graph = params.get('graph') || 'pnp-counter-to-sink';
document.getElementById('graph-name').textContent = graph;

let sessions = [];
let currentFilter = 'all';
let currentRunFilter = 'current';  // 'current' | 'all'
let currentRunId = '';  // populated from orchestrator full_sync

marked.setOptions({
  highlight: (code, lang) => {
    try {
      if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, {language: lang}).value;
      return hljs.highlightAuto(code).value;
    } catch(e) { return code; }
  },
  breaks: true,
  gfm: true,
});

function fmtTime(ts) {
  if (!ts) return '';
  // Accept either Unix seconds (live_sessions from WS uses time.time()) or
  // ISO string (jsonl persisted sessions use datetime.isoformat()).
  const d = typeof ts === 'number' ? new Date(ts * 1000) : new Date(ts);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleString('en-US', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
}

function hasHint(s) {
  return (s.log || []).some(e => typeof e === 'object' && e && e.role === 'user');
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const filtered = sessions.filter(s => {
    // Run filter (current run only by default)
    // Prefer explicit run_id match (if orchestrator emits it); otherwise fall
    // back to `in_progress` as the heuristic for "current" live sessions.
    if (currentRunFilter === 'current') {
      if (currentRunId && s.run_id) {
        if (s.run_id !== currentRunId) return false;
      } else {
        if (!s.in_progress) return false;
      }
    }
    // Type filter
    if (currentFilter === 'all') return true;
    if (currentFilter === 'hint') return hasHint(s);
    return s.agent_type === currentFilter;
  });
  document.getElementById('sessions-count').textContent =
    `${filtered.length} / ${sessions.length} sessions`;

  if (!filtered.length) {
    grid.innerHTML = '<div class="empty-state">No sessions match this filter.</div>';
    return;
  }

  // Per-env color palette (must match index.html ENV_COLORS)
  const ENV_COLORS = ['#9d4edd', '#00d4ff', '#ff8800', '#39ff14', '#ff3366', '#ffb000', '#4d7fff', '#ff40ff'];
  const envColor = (envName) => {
    const m = String(envName || '').match(/(\d+)/);
    const idx = m ? parseInt(m[1], 10) : 0;
    return ENV_COLORS[idx % ENV_COLORS.length];
  };

  // Group sessions by target (env), sorted by env name
  const byEnv = new Map();
  for (const s of filtered) {
    const env = s.target || 'default';
    if (!byEnv.has(env)) byEnv.set(env, []);
    byEnv.get(env).push(s);
  }
  const envOrder = Array.from(byEnv.keys()).sort();

  function hexHTML(s, color) {
    const realIdx = sessions.indexOf(s);
    const hint = hasHint(s);
    const pat = realIdx % 4;
    const turns = s.num_turns || 0;
    const cost = (s.cost_usd || 0).toFixed(3);
    return `
      <div class="hex-card visible" data-type="${s.agent_type}" data-has-hint="${hint}" data-idx="${realIdx}" style="--type-color: ${color}">
        <div class="hex-border">
          <div class="hex-inner">
            <div class="hex-bg pattern-${pat}"></div>
            ${hint ? '<div class="hex-hint-badge">HINT</div>' : ''}
            <div class="hex-content">
              <div class="hex-type">${s.agent_type}</div>
              <div class="hex-num" style="color:${color};">#${String(realIdx + 1).padStart(2,'0')}</div>
              <div class="hex-skill">${s.skill || '—'}</div>
              <div class="hex-meta">${turns} turns · $${cost}</div>
              <div class="hex-meta">${fmtTime(s.timestamp)}</div>
            </div>
          </div>
        </div>
      </div>`;
  }

  // Override the parent grid layout so env-section blocks stack vertically
  grid.style.display = 'block';

  // Render grouped: one row per env
  let html = '';
  for (const env of envOrder) {
    const color = envColor(env);
    const items = byEnv.get(env);
    html += `
      <div class="env-section" style="margin-bottom: 28px; display:block;">
        <div class="env-section-header" style="display:flex; align-items:center; gap:8px; margin-bottom:10px; font-family: var(--font-mono); font-size:0.75rem; letter-spacing:0.1em;">
          <span style="display:inline-block; width:10px; height:10px; background:${color}; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); box-shadow: 0 0 8px ${color};"></span>
          <span style="color:${color}; font-weight:600;">${env}</span>
          <span style="color:var(--color-gray, #777);">· ${items.length} session${items.length === 1 ? '' : 's'}</span>
        </div>
        <div class="env-row-grid" style="display:flex; flex-wrap:wrap; gap:16px;">
          ${items.map(s => hexHTML(s, color)).join('')}
        </div>
      </div>`;
  }
  grid.innerHTML = html;

  grid.querySelectorAll('.hex-card').forEach(el => {
    el.addEventListener('click', () => openSession(parseInt(el.dataset.idx)));
  });
}

// Inline keyword highlighting (mirrors highlightChatText in script.js)
const KW_FAIL_RE    = /\b(fail(?:ed|s|ing|ure)?|error(?:s)?|killed|crash(?:ed|es)?|broken|wrong|never|cannot|can'?t|missed|miss|exception|timeout|stuck|drop(?:ped)?|lost|outside|❌|⚠️)\b/gi;
const KW_SUCCESS_RE = /\b(success(?:ful(?:ly)?)?|succeed(?:s|ed)?|perfect(?:ly)?|great|excellent|works?|working|fixed|fix|correct|passed|pass|done|✓|✅)\b/gi;
const KW_WARN_RE    = /\b(but|however|issue(?:s)?|problem(?:s)?|warning|careful|note|caveat)\b/gi;

function applyKeywordHighlight(html) {
  // Walk the rendered HTML and apply keyword wrapping to TEXT NODES only,
  // skipping inside <code>, <pre>, and existing <span class="kw-...">.
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  const walker = document.createTreeWalker(tmp, NodeFilter.SHOW_TEXT, {
    acceptNode: (n) => {
      let p = n.parentElement;
      while (p && p !== tmp) {
        const tag = p.tagName;
        if (tag === 'CODE' || tag === 'PRE') return NodeFilter.FILTER_REJECT;
        if (p.classList && (p.classList.contains('kw-fail') || p.classList.contains('kw-success') || p.classList.contains('kw-warn'))) return NodeFilter.FILTER_REJECT;
        p = p.parentElement;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const textNodes = [];
  let n; while ((n = walker.nextNode())) textNodes.push(n);
  for (const node of textNodes) {
    const orig = node.nodeValue;
    if (!orig.trim()) continue;
    let s = orig
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    let changed = false;
    if (KW_FAIL_RE.test(s))    { changed = true; s = s.replace(KW_FAIL_RE,    '<span class="kw-fail">$1</span>'); }
    if (KW_SUCCESS_RE.test(s)) { changed = true; s = s.replace(KW_SUCCESS_RE, '<span class="kw-success">$1</span>'); }
    if (KW_WARN_RE.test(s))    { changed = true; s = s.replace(KW_WARN_RE,    '<span class="kw-warn">$1</span>'); }
    if (!changed) continue;
    const wrap = document.createElement('span');
    wrap.innerHTML = s;
    node.parentNode.replaceChild(wrap, node);
  }
  return tmp.innerHTML;
}

function renderMessageBody(text) {
  if (!text) return '';
  try {
    const html = marked.parse(text);
    const safe = DOMPurify.sanitize(html);
    // Apply keyword highlight; allow kw-* class spans through DOMPurify
    return DOMPurify.sanitize(applyKeywordHighlight(safe), {
      ADD_ATTR: ['class'],
    });
  } catch(e) {
    return DOMPurify.sanitize(`<pre>${text}</pre>`);
  }
}

function openSession(idx) {
  const s = sessions[idx];
  const inner = document.getElementById('popup-inner');
  const hint = hasHint(s);
  const turns = s.num_turns || 0;
  const cost = (s.cost_usd || 0).toFixed(4);
  const typeColor = s.agent_type === 'dev' ? 'var(--color-test)' : 'var(--color-purple-bright)';

  const msgs = (s.log || []).map(e => {
    if (typeof e === 'string') return {role: 'agent', text: e};
    return {role: e.role || 'agent', text: e.text || ''};
  });

  const msgHtml = msgs.map(m => `
    <div class="msg role-${m.role}">
      <span class="msg-role">${m.role === 'user' ? '★ Human Hint' : 'Agent'}</span>
      <div class="msg-content">${renderMessageBody(m.text)}</div>
    </div>
  `).join('');

  inner.innerHTML = `
    <div class="conv-header" style="--type-color: ${typeColor}">
      <span class="conv-num">#${String(idx + 1).padStart(2,'0')}</span>
      <span class="conv-type">${s.agent_type}${hint ? ' · hint' : ''}</span>
      <span class="conv-skill">${s.skill || ''}</span>
      <span class="conv-cost">${turns} turns · $${cost}</span>
    </div>
    <div style="font-family: var(--font-mono); font-size: 0.65rem; color: var(--color-gray); letter-spacing: 0.05em;">
      ${fmtTime(s.timestamp)} · session_id: ${s.session_id || '—'}
    </div>
    <div class="conv-body" style="--type-color: ${typeColor}">
      ${msgHtml || '<div class="empty-state">No messages.</div>'}
    </div>
  `;
  document.getElementById('popup').classList.add('open');
}

function closePopup() {
  document.getElementById('popup').classList.remove('open');
}
document.getElementById('popup-close').addEventListener('click', closePopup);
document.getElementById('popup-bd').addEventListener('click', closePopup);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopup(); });

// Type filter buttons (data-filter)
document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderGrid();
  });
});
// Run filter buttons (data-run)
document.querySelectorAll('.filter-btn[data-run]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-run]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentRunFilter = btn.dataset.run;
    renderGrid();
  });
});

async function load() {
  // Sources tried in order:
  // 1. sample_sessions/<graph>.jsonl (static demo data)
  // 2. graphs/<graph>/agent_sessions.jsonl (relative — works if served from claude-code/)
  // 3. http://<host>:8766/sessions/<graph> (orchestrator HTTP — works for any graph live)
  const orchHost = `http://${location.hostname || 'localhost'}:8766`;
  const candidates = [
    {url: `sample_sessions/${graph}.jsonl`, type: 'jsonl'},
    {url: `graphs/${graph}/agent_sessions.jsonl`, type: 'jsonl'},
    {url: `${orchHost}/sessions/${graph}`, type: 'jsonl'},
  ];
  let dataPath = candidates[0].url;
  let loaded = false;
  for (const {url, type} of candidates) {
    try {
      const resp = await fetch(url);
      if (!resp.ok) continue;
      let fresh = [];
      if (type === 'jsonl') {
        const text = await resp.text();
        fresh = text.trim().split('\n').filter(Boolean).map(l => JSON.parse(l));
      } else {
        const data = await resp.json();
        fresh = data.sessions || [];
      }
      // Merge with any sessions already present (e.g. from WS live_sessions that
      // arrived before HTTP returned). Dedupe by (session_id, agent_id) —
      // keep the newer entry.
      const mergeMap = new Map();
      for (const s of fresh) {
        const key = `${s.session_id}|${s.agent_id}`;
        mergeMap.set(key, s);
      }
      for (const s of sessions) {
        const key = `${s.session_id}|${s.agent_id}`;
        const existing = mergeMap.get(key);
        // Prefer in-progress / newer entries
        if (!existing || s.in_progress || (s.timestamp || 0) > (existing.timestamp || 0)) {
          mergeMap.set(key, s);
        }
      }
      sessions = Array.from(mergeMap.values());
      dataPath = url;
      loaded = true;
      break;
    } catch (e) { /* try next */ }
  }
  if (!loaded) {
    document.getElementById('page-sub').textContent = `Error loading: no data source found`;
    document.getElementById('grid').innerHTML =
      `<div class="empty-state">Could not load sessions for graph <code>${graph}</code>.<br>Tried: ${candidates.map(c => c.url).join(', ')}</div>`;
    return;
  }
  // Dedupe by (session_id, agent_id) — keep the latest entry (last turn)
  const seenKey = new Map();
  for (const s of sessions) {
    const key = `${s.session_id}|${s.agent_id}`;
    seenKey.set(key, s);  // overwrite — last wins
  }
  sessions = Array.from(seenKey.values());
  document.getElementById('page-sub').textContent =
    `${sessions.length} agent session${sessions.length === 1 ? '' : 's'} from ${dataPath}`;
  renderGrid();
}
load();

// === Live updates via WebSocket ===
// Subscribe to orchestrator's WS feed; new sessions are pushed in real time
// and prepended to the grid.
function connectLiveFeed() {
  const wsUrl = `ws://${location.hostname || 'localhost'}:8765`;
  let ws;
  try {
    ws = new WebSocket(wsUrl);
  } catch (e) {
    console.warn('[sessions] cannot open WebSocket', e);
    return;
  }
  ws.onopen = () => {
    console.log('[sessions] live feed connected:', wsUrl);
    const banner = document.getElementById('page-sub');
    if (banner) banner.textContent += '  ·  LIVE';
  };
  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch(e) { return; }
    // Pick up current run_id and live sessions from initial full_sync
    if (msg.type === 'full_sync' && msg.payload) {
      const p = msg.payload;
      if (p.run_id) currentRunId = p.run_id;
      // Merge live (in-progress) sessions into local list
      const live = p.live_sessions || [];
      for (const entry of live) {
        if (entry.graph && entry.graph !== graph && entry.skill !== graph) continue;
        if (!entry.timestamp) entry.timestamp = Date.now() / 1000;
        const existingIdx = sessions.findIndex(s => s.session_id === entry.session_id && s.agent_id === entry.agent_id);
        if (existingIdx >= 0) sessions[existingIdx] = entry;
        else sessions.push(entry);
      }
      document.getElementById('page-sub').textContent =
        `${sessions.length} agent session${sessions.length === 1 ? '' : 's'} (live + history)`;
      renderGrid();
      return;
    }
    if (msg.type !== 'session_added') return;
    const entry = msg.session;
    if (!entry) return;
    // Filter: only sessions for this page's graph
    if (entry.graph && entry.graph !== graph && entry.skill !== graph) return;
    if (!entry.timestamp) entry.timestamp = Date.now() / 1000;
    // Dedupe by session_id — replace the older copy with the newer one
    const existingIdx = sessions.findIndex(s => s.session_id === entry.session_id && s.agent_id === entry.agent_id);
    if (existingIdx >= 0) {
      sessions[existingIdx] = entry;
    } else {
      sessions.push(entry);
    }
    document.getElementById('page-sub').textContent =
      `${sessions.length} agent session${sessions.length === 1 ? '' : 's'} (live)`;
    renderGrid();
    // Brief flash on the newest hex
    requestAnimationFrame(() => {
      const newest = document.querySelector(`.hex-card[data-idx="${sessions.length - 1}"]`);
      if (newest) {
        newest.style.transition = 'box-shadow 1s';
        newest.style.boxShadow = '0 0 24px var(--color-purple-bright)';
        setTimeout(() => { newest.style.boxShadow = ''; }, 1500);
      }
    });
  };
  ws.onclose = () => {
    console.log('[sessions] WS closed, reconnecting in 3s');
    setTimeout(connectLiveFeed, 3000);
  };
  ws.onerror = () => { try { ws.close(); } catch(_){} };
}
connectLiveFeed();
</script>
